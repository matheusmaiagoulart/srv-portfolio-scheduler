spring:
  datasource:
    url: ${url}
    driver-class-name: ${drive}
    username: ${username}
    password: ${password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  pathsToMatch: /**
  swagger-ui:
    enabled: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG