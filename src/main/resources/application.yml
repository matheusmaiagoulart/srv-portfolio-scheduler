app:
  customers_batch_size: 1000
  outbox_batch_size: 1000
  cotahist:
    path: cotahist/COTAHIST_D
  aliquota: 0.00005

spring:
  datasource:
    url: ${URL}
    driver-class-name: ${DRIVE}
    username: ${USERNAME}
    password: ${PASSWORD}
    hikari:
      maximum-pool-size: 40
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      type:
        preferred_enum_jdbc_type: VARCHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${BOOTSTRAP-SERVER}
    consumer:
      group-id: ${GROUP-ID}
      auto-offset-reset: earliest
    topics:
      ir-dedo-duro-compra-topic: "ir-compra-ativos"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
      prefixes:
        customer-portfolio: "customer-portfolio:"
        portfolio-history: "portfolio-history:"

springdoc:
  pathsToMatch: /**
  swagger-ui:
    enabled: true

logging:
  level:
    org.flywaydb: debug
    org.springframework.boot.autoconfigure.flyway: debug
    com.zaxxer.hikari.HikariConfig: debug
  pattern:
    console: "%d %-5level [%X{correlation_id}] %logger - %msg%n"